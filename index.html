<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魷魚遊戲 - 數位版玻璃橋遊戲</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #222;
            color: white;
        }
        h1 {
            margin-top: 20px;
        }
        p {
            font-size: 18px;
            margin-bottom: 20px;
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: 20px;
        }
        .choice-button {
            padding: 15px 30px;
            font-size: 20px;
            background-color: #ff4757;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .choice-button:hover {
            background-color: #e84118;
        }
    </style>
</head>
<body onload="startGame()">
    <h1>歡迎參加魷魚遊戲!</h1>
    <p>這是數位版的玻璃橋遊戲。選擇左邊或右邊，看看你能活到第幾關!</p>
    <div class="game-container" id="game"></div>
    <div class="button-container" id="choice-buttons" style="display: none;">
        <button class="choice-button" onclick="makeChoice(0)">左邊</button>
        <button class="choice-button" onclick="makeChoice(1)">右邊</button>
    </div>
    
    <script>
        let level, lastAnswer, sameAnswerCount, winCount, maxLevel;
        
        function startGame() {
            level = 1;
            lastAnswer = -1;
            sameAnswerCount = 0;
            winCount = 0;
            maxLevel = 50;
            document.getElementById("game").innerHTML = "<p>請選擇左邊或右邊:</p>";
            document.getElementById("choice-buttons").style.display = "flex";
        }

        function showMilestoneMessage() {
            const messages = {
                5: "你已成功踏上第五塊玻璃，開始感受到腳底的顫抖了嗎？",
                10: "雖然你還沒能許願，但你獲得了【心態崩潰免疫】Buff，讓你更容易走下去！",
                20: "傳說這裡有隱藏的捷徑……但沒人知道它在哪裡。繼續走吧！",
                30: "現在回頭看看……你已經超越了大部分挑戰者！你能挺到最後嗎？",
                40: "玻璃已經開始顫抖，你的決策將決定你的生死！",
                50: "恭喜你！你成功活過了所有關卡，傳說中的願望將為你實現！"
            };
            if (messages[level]) {
                alert(messages[level]);
            }
        }

        function makeChoice(guess) {
            let answer = Math.floor(Math.random() * 2);

            if (guess === answer) {
                alert("恭喜你通過第" + level + "關!");
                sameAnswerCount = 0;
                winCount++;
                
                showMilestoneMessage();

                level++;
                lastAnswer = answer;

                if (level > maxLevel) {
                    alert("你已通過所有關卡！恭喜！");
                    document.getElementById("choice-buttons").style.display = "none";
                    return;
                }
            } else {
                if (guess === lastAnswer && sameAnswerCount === 2) {
                    alert("你以為答案都會是一樣的嗎");
                    sameAnswerCount = 0;
                } else {
                    alert("你已經死亡，請使用轉生大卡車");
                    sameAnswerCount++;
                }
                alert("你共通過了" + (level - 1) + "關。");
                document.getElementById("choice-buttons").style.display = "none";
                if (confirm("是否使用轉生大卡車?")) {
                    startGame();
                }
            }
        }
    </script>
</body>
</html>
